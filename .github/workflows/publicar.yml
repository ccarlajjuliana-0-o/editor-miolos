name: Publicar estúdio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preencher as chaves da nuvem
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          APP_ATELIE: ${{ vars.APP_ATELIE_URL }}
        run: |
          node -e "require('fs').writeFileSync('config.js','window.CNU = '+JSON.stringify({url:process.env.SUPABASE_URL||'',key:process.env.SUPABASE_KEY||'',appAtelie:process.env.APP_ATELIE||''})+';\n')"
      - name: Montar a pasta do site
        run: |
          mkdir site
          cp -r index.html estilo.css modulab.js textos.js rapido.js linhas.js bordas.js tema.js app.js vetor.js aparencia.js layout.js protecao.js recursos.js exportar.js tamanho.js paginas.js margens.js lados.js importar.js camadas.js widgets.js estilos.js widgetsbib.js widgetsprop.js barra.js seletor.js avisos.js config.js sw.js manifest.webmanifest icons vendor site/
          sed -i "s/__V__/${GITHUB_SHA::8}/g" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
